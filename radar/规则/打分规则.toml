# 机会雷达打分规则
#
# 只有我能改。改完提交到 git；score.py 每次都会按这里的规则把全部方向重算一遍，
# 所以不会出现新旧口径混在一起的情况。
#
# 填数据时，所有"选项"只能从这里列出的写法里选，一个字都不能差，
# 否则 score.py 会把那一项当成"缺失"或"无效"。

["通用"]
"线下来源" = "线下访谈"         # 来源清单里线下访谈那一行的名称
"交汇回看天数" = 90             # 统计"一个方向出现在几条线上"时，只看最近这么多天的信号
"扩散回看天数" = 7              # 统计"扩散速度"时看最近这么多天新增的信号
"长钱最多推送" = 5
"快钱最多推送" = 3              # 长钱是主线，快钱少推一些
"观察列表展示" = 5              # 没过门槛、但分数靠前的方向，周报里展示几个
"政策临近施行天数" = 90

["枚举"]
"所属线" = ["技术普及", "经营压力", "政策"]
"方向类型" = ["快钱", "长钱"]
"方向状态" = ["观察中", "候选", "验证中", "通过", "否决", "窗口关闭"]
"政策阶段" = ["规划", "征求意见", "发布", "施行", "细则", "执法"]   # 顺序就是推进顺序，只能往前走
"政策类型" = ["发钱", "加义务", "撑腰", "开窗", "关窗"]
"验证方式" = ["访谈", "定金测试"]
"验证结果" = ["确认痛点", "有人付定金", "未确认", "否定"]

# 信号的"阶段"一栏怎么填，取决于它属于哪条线。
# 政策线的信号，"阶段"一栏填这条政策的类型。
["阶段"]
"技术普及" = ["新能力出现", "开始普及", "出现摩擦", "有人付钱", "大厂进场"]
"经营压力" = ["压力出现", "压力持续", "开始花钱"]
"政策" = ["发钱", "加义务", "撑腰", "开窗", "关窗"]

# ---------------------------------------------------------------- 快钱
# 快钱分 = 扩散速度 × 付费证据 × 窗口剩余 × 交汇系数

["快钱"."付费证据"]             # 信号的"付费证据"一栏；一个方向取它所有信号里最高的
"无" = 1
"服务或课程上架" = 3
"有销量或海外已验证收入" = 5

["快钱"."窗口剩余"]             # 方向的"窗口剩余"一栏
"无大厂进场" = 5
"同赛道融资" = 3
"云厂商一键方案" = 1

["快钱"."扩散速度"]
# 第一阶段数据少，先按"最近 7 天这个方向新增了几条信号"分档；攒够 8 周数据后改成按历史分位数。
# 每一档写成 [至少多少条, 得几分]，从高往低匹配。
"档位" = [[7, 5], [4, 4], [2, 3], [1, 2], [0, 1]]

["快钱"."门槛"]
"最少阶段数" = 2                # 技术普及线的信号至少覆盖这么多个不同阶段
"最少付费信号" = 1              # "付费证据"不是"无"的信号至少这么多条

# ---------------------------------------------------------------- 长钱
# 长钱分 = 金额 × 频次 × 持续性 × 技术门槛 × 决策链 × 准入成本系数 × 交汇系数

["长钱"."金额"]
# 方向的"每月金额元"一栏：老板每月在这件事上的花费或损失。
# 每一档写成 [至少多少元, 得几分]，从高往低匹配。
"档位" = [[50000, 5], [10000, 4], [5000, 3], [1000, 2], [0, 1]]

["长钱"."频次"]
"每年" = 1
"每季" = 2
"每月" = 3
"每周" = 4
"每天" = 5

["长钱"."持续性"]
"一次性" = 1
"一年以内" = 2
"一到三年" = 3
"三年以上" = 5                  # 由政策或行业结构驱动、能持续 3 年以上

["长钱"."技术门槛"]
"调接口即可" = 1
"一般开发" = 2
"需要数据清洗或系统集成" = 3
"需要高可靠或权限审计" = 5

["长钱"."决策链"]
"多部门审批" = 1
"部门负责人决定" = 3
"老板一人拍板" = 5

["长钱"."门槛"]
"最少线下信号" = 1
"或最少带金额公开信号" = 2      # 没有线下信号时，至少要有这么多条带金额的公开信号

# ---------------------------------------------------------------- 通用
["准入成本"]                    # 方向的"准入成本"一栏；0 表示直接过滤
"只需营业执照" = 1.0
"轻备案" = 0.8                  # 3 个月内、5 万元以内能办完，不需要专职人员
"重许可" = 0.5                  # 6 到 12 个月，或要求实缴注册资本、专职持证人员、固定场所
"个人拿不到" = 0.0

["交汇"]
"一条线" = 1.0
"两条线" = 1.3
"三条线" = 1.6

# ---------------------------------------------------------------- 行业压力
# 每月一次，用国家统计局"规模以上工业企业主要财务指标（分行业）"表。
# 对表里的每一个行业都按同一条规则判断，不挑行业、不挑指标。
# 统计局不按行业公布应收账款和存货，所以只用收入、成本、利润三项。
# 两个条件同时满足，就给这个行业记一条"压力出现"的信号。
["行业压力"]
"利润增速回落至少" = 5.0        # 利润总额累计增速比上一期低了至少这么多个百分点
"要求成本增速高于收入增速" = true
